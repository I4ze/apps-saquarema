<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Baixe o Saquarema Estabelecimento</title>
  <meta name="description" content="Baixe o app na App Store ou no Google Play.">

  <!-- Prévia ao compartilhar no WhatsApp/redes (opcional: troque a imagem) -->
  <meta property="og:title" content="Baixe o Saquarema Estabelecimento">
  <meta property="og:description" content="Disponível para iPhone e Android.">
  <meta property="og:type" content="website">
  <!-- <meta property="og:image" content="https://SEU-USUARIO.github.io/SEU-REPO/og.png"> -->

  <script>
    // ===== CONFIGURAÇÃO: edite só estas linhas =====
    var CONFIG = {
      appName: "Saquarema Estabelecimento",
      ios: "https://apps.apple.com/us/app/saquarema-estabelecimento/id6770665234",
      android: "https://play.google.com/store/apps/details?id=programa.saquarema.establishment"
    };
    // ===============================================

    (function () {
      var ua = navigator.userAgent || "";
      var params = new URLSearchParams(location.search);
      // ?noredirect=1 mostra a página sem redirecionar (útil para testar)
      if (params.has("noredirect")) return;

      var isIOS = /iPhone|iPad|iPod/i.test(ua) ||
        (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1); // iPadOS
      var isAndroid = /Android/i.test(ua);

      if (isIOS) location.replace(CONFIG.ios);
      else if (isAndroid) location.replace(CONFIG.android);
    })();
  </script>

  <style>
    :root {
      --bg: #f6f7f9;
      --card: #ffffff;
      --text: #1a1d21;
      --muted: #5f6670;
      --border: #e3e6ea;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111315;
        --card: #1b1e21;
        --text: #f1f3f5;
        --muted: #a2a9b1;
        --border: #2c3035;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      padding: 24px;
    }
    main {
      width: 100%;
      max-width: 420px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 32px 28px;
      text-align: center;
    }
    .icon {
      width: 88px;
      height: 88px;
      border-radius: 22px;
      margin: 0 auto 16px;
      display: block;
      object-fit: cover;
      background: var(--border);
    }
    h1 { font-size: 1.5rem; margin: 0 0 6px; }
    p { color: var(--muted); margin: 0 0 24px; line-height: 1.5; }
    .stores { display: grid; gap: 12px; }
    .store {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 14px 18px;
      border-radius: 12px;
      background: #000;
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      font-size: 1rem;
      transition: transform .1s ease, opacity .15s ease;
    }
    .store:hover { opacity: .88; }
    .store:active { transform: scale(.98); }
    .store svg { width: 22px; height: 22px; fill: currentColor; flex-shrink: 0; }
    @media (prefers-color-scheme: dark) {
      .store { background: #fff; color: #000; }
    }
    .qr {
      margin-top: 28px;
      padding-top: 24px;
      border-top: 1px solid var(--border);
    }
    .qr p { margin-bottom: 14px; font-size: .9rem; }
    #qrcode {
      display: inline-block;
      background: #fff;
      padding: 12px;
      border-radius: 12px;
      line-height: 0;
    }
    #qrcode img, #qrcode svg { width: 168px; height: 168px; }
  </style>
</head>
<body>
  <main>
    <img class="icon" src="icon.png" alt="" onerror="this.style.display='none'">
    <h1 id="title">Baixe o Saquarema Estabelecimento</h1>
    <p>Disponível para iPhone e Android.</p>

    <div class="stores">
      <a class="store" id="link-ios" href="#" rel="noopener">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16.37 12.6c-.02-2.2 1.8-3.26 1.88-3.31-1.02-1.5-2.62-1.7-3.19-1.72-1.36-.14-2.65.8-3.34.8-.69 0-1.75-.78-2.88-.76-1.48.02-2.85.86-3.61 2.19-1.54 2.67-.39 6.62 1.11 8.79.73 1.06 1.6 2.25 2.75 2.2 1.1-.04 1.52-.71 2.85-.71 1.33 0 1.71.71 2.88.69 1.19-.02 1.94-1.08 2.66-2.14.84-1.23 1.19-2.42 1.21-2.48-.03-.01-2.31-.89-2.32-3.55zM14.17 6.13c.61-.74 1.02-1.76.91-2.78-.88.04-1.94.59-2.57 1.32-.56.65-1.06 1.69-.93 2.69.98.08 1.98-.5 2.59-1.23z"/></svg>
        App Store
      </a>
      <a class="store" id="link-android" href="#" rel="noopener">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.6 2.2c-.2.2-.3.6-.3 1v17.6c0 .4.1.8.3 1l.1.1 9.9-9.9v-.2L3.7 2.1l-.1.1zm13.3 13.2-3.3-3.3v-.2l3.3-3.3.1.1 3.9 2.2c1.1.6 1.1 1.7 0 2.3l-3.9 2.2h-.1zm-.1.1L13.4 12 3.6 21.8c.4.4 1 .4 1.7 0l11.5-6.3M16.8 8.5 5.3 2.2c-.7-.4-1.3-.3-1.7.1l9.8 9.7 3.4-3.5z"/></svg>
        Google Play
      </a>
    </div>

    <div class="qr" id="qr-section">
      <p>Está no computador? Aponte a câmera do celular:</p>
      <div id="qrcode"></div>
    </div>
  </main>

  <noscript>
    <style>#qr-section{display:none}</style>
  </noscript>

  <!-- Gerador de QR code (aponta para a própria URL desta página) -->
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
  <script>
    document.getElementById("link-ios").href = CONFIG.ios;
    document.getElementById("link-android").href = CONFIG.android;
    document.getElementById("title").textContent = "Baixe o " + CONFIG.appName;
    document.title = "Baixe o " + CONFIG.appName;

    try {
      var url = location.origin + location.pathname; // sem ?noredirect
      var qr = qrcode(0, "M");
      qr.addData(url);
      qr.make();
      document.getElementById("qrcode").innerHTML = qr.createSvgTag({ cellSize: 4, margin: 0 });
    } catch (e) {
      document.getElementById("qr-section").style.display = "none";
    }
  </script>
</body>
</html>
