<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Apps Saquarema</title>
  <meta name="description" content="Baixe os apps Saquarema Cartão e Saquarema Estabelecimento.">
  <meta property="og:title" content="Apps Saquarema">
  <meta property="og:description" content="Disponíveis para iPhone e Android.">
  <meta property="og:type" content="website">
  <style>
    :root { --bg:#f6f7f9; --card:#fff; --text:#1a1d21; --muted:#5f6670; --border:#e3e6ea; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#111315; --card:#1b1e21; --text:#f1f3f5; --muted:#a2a9b1; --border:#2c3035; }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: var(--bg); color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 24px;
    }
    main { width: 100%; max-width: 420px; text-align: center; }
    h1 { font-size: 1.5rem; margin: 0 0 6px; }
    p { color: var(--muted); margin: 0 0 24px; }
    .apps { display: grid; gap: 12px; }
    a.app {
      display: flex; align-items: center; justify-content: space-between;
      padding: 20px 22px; border-radius: 16px; background: var(--card);
      border: 1px solid var(--border); color: var(--text); text-decoration: none;
      font-weight: 600; font-size: 1.05rem; transition: transform .1s ease, border-color .15s ease;
    }
    a.app:hover { border-color: var(--muted); }
    a.app:active { transform: scale(.98); }
    a.app span { color: var(--muted); font-size: 1.3rem; }
  </style>
</head>
<body>
  <main>
    <h1>Apps Saquarema</h1>
    <p>Escolha o app que deseja baixar.</p>
    <div class="apps">
      <a class="app" href="cartao/">Saquarema Cartão <span>›</span></a>
      <a class="app" href="estabelecimento/">Saquarema Estabelecimento <span>›</span></a>
    </div>
  </main>
</body>
</html>
